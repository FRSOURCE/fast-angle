name: Deploy to App Store
description: Build the signed iOS app, upload it and submit it for App Store review
inputs:
  dist-cert-base64:
    description: Apple Distribution certificate (.p12) encoded into base64 string
    required: true
  dist-cert-password:
    description: password to the .p12 certificate
    required: true
  asc-key-id:
    description: App Store Connect API key ID
    required: true
  asc-issuer-id:
    description: App Store Connect API issuer ID
    required: true
  asc-api-key:
    description: App Store Connect API private key (raw contents of the .p8 file)
    required: true
runs:
  using: "composite"
  steps:
    # Imports the Apple Distribution certificate into a temporary keychain.
    # Runners are ephemeral, so no cleanup is needed.
    - uses: apple-actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ inputs.dist-cert-base64 }}
        p12-password: ${{ inputs.dist-cert-password }}

    # The App Store provisioning profile is fetched (and created/renewed when missing
    # or expired) by the fastlane lane itself via `get_provisioning_profile`, using the
    # same ASC API key — a download-only step would fail whenever no ACTIVE profile
    # exists for the bundle id.
    # note: the platform segment is case-sensitive — it must match `platform :ios` in the Fastfile
    - run: fastlane ios release
      shell: bash
      working-directory: packages/ios
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.asc-key-id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        APP_STORE_CONNECT_API_KEY: ${{ inputs.asc-api-key }}
