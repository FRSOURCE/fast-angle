# https://proandroiddev.com/how-to-securely-build-and-sign-your-android-app-with-github-actions-ad5323452ce
# https://developer.chrome.com/docs/android/trusted-web-activity/receive-payments-play-billing/
name: Deploy to Google Play
description: Build the app and publishes it to Google Play
inputs:
  keystore-base64:
    description: keystore encoded into base64 string
    required: true
  keystore-password:
    description: password to keystore
    required: true
  service-account-key:
    description: GCP service account in JSON format
    required: true
runs:
  using: "composite"
  steps:
    # Cache bubblewrap environment (JDK 17 + Android SDK) so the interactive setup wizard
    # only runs on the first cold-cache build. Key on @bubblewrap/cli version so it
    # invalidates automatically when the dependency is bumped.
    - uses: actions/cache@v6
      with:
        path: ~/.bubblewrap
        key: bubblewrap-${{ runner.os }}-${{ hashFiles('packages/android/package.json') }}

    # first script sends "Y" to any prompt raised by bubblewrap CLI
    # 2>/dev/null allows script to finish successfully when script after the pipe | is done
    # sleep 10 ensures the SDK terms prompt (default: false) gets answered quickly
    # on cold-cache runs where the JDK/SDK setup wizard fires
    - run: |
        set +o pipefail
        unset ANDROID_SDK_ROOT
        while true; do echo "Y"; sleep 10; done 2>/dev/null | pnpm --filter '@frsource/fast-angle-android' new-version
      shell: bash
    - run: echo $KEYSTORE_BASE64 | base64 -d > android-keystore
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
      shell: bash

    # unset is needed because bubblewrap CLI installs its own version of Android SDK and properly specifies its path unsed ANDROID_HOME env variable
    - run: |
        set +o pipefail
        unset ANDROID_SDK_ROOT
        while true; do echo "Y"; sleep 10; done 2>/dev/null | pnpm --filter '@frsource/fast-angle-android' build --signingKeyPath="../../android-keystore"
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ inputs.keystore-password }}
      shell: bash
    - run: rm android-keystore
      shell: bash
    - run: echo $GCP_SERVICE_ACCOUNT_KEY > service-account.json
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ inputs.service-account-key }}
      shell: bash
    - name: Debug environment
      run: |
        echo "=== Node.js version ==="
        node --version
        echo "=== globalThis.fetch available ==="
        node -e "console.log('globalThis.fetch:', typeof globalThis.fetch)"
        echo "=== gaxios fetch implementation ==="
        node -e "
          const g = require('@bubblewrap/core/node_modules/gaxios') || require('gaxios');
          console.log('gaxios loaded, fetch type:', typeof g.request);
        " 2>/dev/null || node -e "
          // Try resolving from bubblewrap's perspective
          const path = require('path');
          const gaxiosPath = require.resolve('gaxios', {paths: [path.join(process.env.HOME, '.bubblewrap')]});
          console.log('gaxios path:', gaxiosPath);
        " 2>/dev/null || echo "could not load gaxios directly"
        echo "=== Service account JSON structure (keys only) ==="
        python3 -c "import json,sys; d=json.load(open('../../service-account.json')); print('keys:', list(d.keys())); print('type:', d.get('type')); print('token_uri:', d.get('token_uri'))" 2>&1
      shell: bash
      working-directory: packages/android
    # Google Play rejects a version code that was already uploaded. That happens when an earlier
    # run published the bundle but never managed to commit the version bump (e.g. its push was
    # rejected because main moved, or the run got cancelled). The bump `bubblewrap update` made
    # in this run is then exactly the missing commit: skip the upload (retrying is pointless) and
    # fall through to the commit step so the next run starts from the correct version code.
    - run: |
        set +o pipefail
        RELEASE_LOG="$RUNNER_TEMP/bubblewrap-release.log"
        for attempt in 1 2 3; do
          while true; do echo "Y"; sleep 10; done 2>/dev/null | \
            pnpm --filter '@frsource/fast-angle-android' release --track="production" --serviceAccountFile="../../service-account.json" 2>&1 | \
            tee "$RELEASE_LOG"
          RELEASE_EXIT=${PIPESTATUS[1]}
          [ $RELEASE_EXIT -eq 0 ] && break
          if grep -q "has already been used" "$RELEASE_LOG"; then
            VERSION_CODE=$(jq '.appVersionCode' packages/android/twa-manifest.json)
            echo "::warning::Version code $VERSION_CODE is already published to Google Play (most likely by an earlier run that failed to commit the version bump). Skipping upload; committing the bump so the next release uses $((VERSION_CODE + 1))."
            RELEASE_EXIT=0
            break
          fi
          echo "Attempt $attempt/3 failed (exit $RELEASE_EXIT). Retrying in 30s..."
          sleep 30
        done
        exit $RELEASE_EXIT
      shell: bash
    - run: rm service-account.json
      shell: bash
    - name: Generate release commit info (commit message)
      id: commit_info
      run: |
        echo "message=chore(release): android app v$(cat packages/android/twa-manifest.json | jq '.appVersionCode') [no ci]" >> $GITHUB_OUTPUT
      shell: bash
    # main may have moved while the app was building (e.g. another PR got merged). Without this
    # the push below is rejected, the version bump is lost and the next run reuses an
    # already-published version code.
    - name: Rebase onto latest main
      run: git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" pull --rebase --autostash origin main
      shell: bash
    - uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: ${{ steps.commit_info.outputs.message }}
        file_pattern: 'packages/android/*'
        disable_globbing: true
        branch: main
